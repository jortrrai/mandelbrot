name: Android app

# Builds the Android app (issue #219) with the Android SDK and NDK that GitHub's Ubuntu runners come with, into a debug-signed APK kept as an artifact (to
# install on a phone: allow installing apps from this source). On a pull request that changes the app's code or this workflow, and by hand.
on:
  pull_request:
    paths: [ "src/**", "android/**", "Cargo.toml", "Cargo.lock", ".github/workflows/android.yml" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo apk build -p mandelbrot-android --release
      - uses: actions/upload-artifact@v4
        with:
          name: mandelbrot-android-arm64
          path: target/release/apk/*.apk
