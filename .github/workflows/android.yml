name: Android app

# Builds the Android app (issue #219) with the Android SDK and NDK that GitHub's Ubuntu runners come with, into a debug-signed APK kept as an artifact (to
# install on a phone: allow installing apps from this source). On a pull request that changes the app's code or this workflow, and by hand.
on:
  pull_request:
    paths: [ "src/**", "android/**", "Cargo.toml", ".github/workflows/android.yml" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android
      - name: cargo-apk
        run: cargo install cargo-apk --locked
      # Signed with a debug key made for this run: enough to install it for a test (a later build with another key needs the app uninstalled first). A
      # lasting release key would be a repository secret, which is Jort's to make
      - name: Build
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/debug.keystore" CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cd android && cargo apk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: mandelbrot-android-arm64
          path: android/target/release/apk/*.apk
