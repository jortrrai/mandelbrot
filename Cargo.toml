[package]
name = "mandelbrot"
version = "0.4.0"
edition = "2021"
repository = "https://github.com/jortrr/mandelbrot"
readme = "README.md"
license = "LICENSE"
description = "Mandelbrot by Jort, Mandelbrot set viewer written in Rust"
keywords = ["mandelbrot", "mandelbrot-set"]
categories = ["mathematics", "rendering", "visualization"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "clipboard", "wayland", "x11"] }
angular-units = "0.2.4"
chrono = "0.4.26"
num = "0.4.0"
num_cpus = "1.15.0"
png = "0.17.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
prisma = "0.1.1"
wgpu = "30"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cpu-time = "1"
ureq = "2"
# The system's file chooser for Open image (on Linux through the desktop portal, so it needs no GTK and works on Wayland, where dropped files never arrive)
rfd = "0.17"

# Lowering the priority of the CPU workers of videos, so the threads that feed the GPU get a core first (Linux)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1

[dev-dependencies]
rand = "0.8.5"
